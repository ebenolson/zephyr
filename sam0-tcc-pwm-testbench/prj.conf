CONFIG_ZTEST=y
# One summary line per suite; src/report.c prints the readable result
CONFIG_ZTEST_VERBOSE_SUMMARY=n
CONFIG_PWM=y
# The tests time TCC overflows with k_cycle_get_64().
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
# Preemptible test thread, so the USB stack and the UF2 reboot thread can
# run during a test. Measurements lock interrupts instead.
CONFIG_ZTEST_THREAD_PRIORITY=5
